<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Run & Earn Gaming Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .wallet-box {
            background: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            color: #00ffcc;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #e64a19;
        }
        .btn-secondary {
            background: #333;
        }
        .btn-secondary:hover {
            background: #444;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
        }
        .game-area {
            height: 220px;
            background: #0f172a;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .chicken {
            font-size: 40px;
            position: absolute;
            left: 30px;
            transition: bottom 0.3s;
        }
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .nav-tabs button {
            flex: 1;
            padding: 6px 8px;
            background: #2c2c2c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }
        .nav-tabs button.active {
            background: #ff5722;
        }
        .status-box {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            border-left: 4px solid #ff5722;
        }
        /* Spin Wheel Styling */
        .wheel-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .wheel {
            width: 150px;
            height: 150px;
            border: 6px solid #ff5722;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            background: #2c2c2c;
            transition: transform 3s ease-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>🎮 Gaming Hub</h2>
            <div class="wallet-box">Rs: <span id="balance">100</span></div>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('game1')">🐔 Chicken</button>
            <button class="tab-btn" onclick="switchTab('game2')">🪙 Flip</button>
            <button class="tab-btn" onclick="switchTab('game3')">🎡 Spin</button>
            <button class="tab-btn" onclick="switchTab('deposit')">Deposit</button>
            <button class="tab-btn" onclick="switchTab('withdraw')">Withdraw</button>
        </div>

        <!-- 1. CHICKEN RUN GAME -->
        <div id="game1" class="section active">
            <div class="game-area">
                <div class="chicken" id="chicken" style="bottom: 20px;">🐔</div>
            </div>
            <p style="text-align: center; margin-bottom: 10px; font-size: 13px; color: #aaa;">Jump to win coins! (Cost: 10 Rs)</p>
            <button class="btn" onclick="jumpChicken()">Jump Now!</button>
        </div>

        <!-- 2. COIN FLIP GAME -->
        <div id="game2" class="section">
            <div class="game-area" style="flex-direction: column;">
                <div id="coinResult" style="font-size: 50px; margin-bottom: 10px;">🪙</div>
                <p id="coinText" style="font-size: 14px; color: #00ffcc;">Select Head or Tail & Bet</p>
            </div>
            <label>Choose Side</label>
            <select id="coinChoice">
                <option value="Head">Head</option>
                <option value="Tail">Tail</option>
            </select>
            <label>Bet Amount (Rs)</label>
            <input type="number" id="coinBet" value="20">
            <button class="btn" onclick="playCoinFlip()">Flip Coin</button>
        </div>

        <!-- 3. LUCKY SPIN WHEEL -->
        <div id="game3" class="section">
            <div class="wheel-container">
                <div class="wheel" id="spinWheel">SPIN</div>
            </div>
            <p style="text-align: center; font-size: 13px; color: #aaa; margin-bottom: 10px;">Cost per spin: 20 Rs</p>
            <button class="btn" onclick="spinWheelGame()">Spin the Wheel</button>
        </div>

        <!-- DEPOSIT SECTION -->
        <div id="deposit" class="section">
            <h3>Add Funds (Manual)</h3>
            <div style="background: #2c2c2c; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 13px;">
                <p><b>JazzCash / EasyPaisa:</b> 0300-1234567</p>
                <p><b>Account Title:</b> Admin Gaming</p>
            </div>
            <label>Method</label>
            <select id="depMethod">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
            </select>
            <label>Amount (PKR)</label>
            <input type="number" id="depAmount" placeholder="Enter amount">
            <label>Transaction ID (TID)</label>
            <input type="text" id="depTid" placeholder="Enter 11-digit TID">
            <button class="btn" onclick="submitDeposit()">Submit Deposit</button>
        </div>

        <!-- WITHDRAW SECTION -->
        <div id="withdraw" class="section">
            <h3>Withdraw Funds</h3>
            <label>Method</label>
            <select id="wdMethod">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
            </select>
            <label>Account Number</label>
            <input type="text" id="wdAccount" placeholder="03XXXXXXXXX">
            <label>Amount (PKR)</label>
            <input type="number" id="wdAmount" placeholder="Enter amount">
            <button class="btn" onclick="submitWithdraw()">Request Withdrawal</button>
            <div id="withdrawStatus"></div>
        </div>
    </div>

    <script>
        let balance = 100; 
        let hasWithdrawnBefore = false;

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }

        // 1. Chicken Game Logic
        function jumpChicken() {
            if (balance < 10) {
                alert("Low balance! Please deposit funds.");
                return;
            }
            balance -= 10;
            updateBalance();

            const chicken = document.getElementById('chicken');
            chicken.style.bottom = '100px';
            setTimeout(() => {
                chicken.style.bottom = '20px';
                if (Math.random() > 0.4) {
                    balance += 25;
                    updateBalance();
                }
            }, 300);
        }

        // 2. Coin Flip Logic
        function playCoinFlip() {
            let bet = parseInt(document.getElementById('coinBet').value);
            let choice = document.getElementById('coinChoice').value;

            if (isNaN(bet) || bet <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }
            if (balance < bet) {
                alert("Insufficient balance!");
                return;
            }

            balance -= bet;
            updateBalance();

            let outcome = Math.random() < 0.5 ? "Head" : "Tail";
            let coinResult = document.getElementById('coinResult');
            let coinText = document.getElementById('coinText');

            coinResult.innerText = outcome === "Head" ? "🪙 H" : "🪙 T";

            if (outcome === choice) {
                let winAmount = bet * 2;
                balance += winAmount;
                updateBalance();
                coinText.innerHTML = `<span style="color: #00ffcc;">You Won Rs. ${winAmount}! (${outcome})</span>`;
            } else {
                coinText.innerHTML = `<span style="color: #ff3333;">You Lost! It was ${outcome}</span>`;
            }
        }

        // 3. Spin Wheel Logic
        let currentDegree = 0;
        function spinWheelGame() {
            if (balance < 20) {
                alert("Low balance! You need at least Rs. 20 to spin.");
                return;
            }
            balance -= 20;
            updateBalance();

            let wheel = document.getElementById('spinWheel');
            let prizes = [0, 10, 20, 40, 50, 100];
            let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
            
            currentDegree += 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${currentDegree}deg)`;
            wheel.innerText = "...";

            setTimeout(() => {
                wheel.innerText = "Rs " + randomPrize;
                balance += randomPrize;
                updateBalance();
                if(randomPrize > 0) {
                    alert("Congratulations! You won Rs. " + randomPrize);
                } else {
                    alert("Oops! Better luck next time.");
                }
            }, 3000);
        }

        // Deposit Logic
        function submitDeposit() {
            const amount = document.getElementById('depAmount').value;
            const tid = document.getElementById('depTid').value;
            if(!amount || !tid) {
                alert("Please fill all fields!");
                return;
            }
            alert("Deposit request submitted successfully!");
            document.getElementById('depAmount').value = '';
            document.getElementById('depTid').value = '';
        }

        // Withdraw Logic
        function submitWithdraw() {
            const amount = document.getElementById('wdAmount').value;
            const account = document.getElementById('wdAccount').value;
            const statusDiv = document.getElementById('withdrawStatus');

            if(!amount || !account) {
                alert("Please fill all fields!");
                return;
            }
            if(amount > balance) {
                alert("Insufficient balance!");
                return;
            }

            balance -= parseInt(amount);
            updateBalance();

            if (!hasWithdrawnBefore) {
                hasWithdrawnBefore = true;
                statusDiv.innerHTML = `
                    <div class="status-box">
                        <b>Withdrawal Request Submitted!</b><br>
                        Status: <span style="color: #ff9800;">Pending (24 Hours Timer)</span><br>
                        First withdrawal of Rs. ${amount} will be processed within 24 hours.
                    </div>
                `;
            } else {
                statusDiv.innerHTML = `
                    <div class="status-box" style="border-left-color: #00ffcc;">
                        <b>Withdrawal Request Submitted!</b><br>
                        Status: <span style="color: #00ffcc;">Processing</span><br>
                        Rs. ${amount} sent to ${account}.
                    </div>
                `;
            }

            document.getElementById('wdAmount').value = '';
            document.getElementById('wdAccount').value = '';
        }
    </script>
</body>
</html>
