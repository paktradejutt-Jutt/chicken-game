<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Run Game & Earn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .wallet-box {
            background: #2c2c2c;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            color: #00ffcc;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #e64a19;
        }
        .btn-secondary {
            background: #333;
        }
        .btn-secondary:hover {
            background: #444;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
        }
        .game-area {
            height: 250px;
            background: #0f172a;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .chicken {
            font-size: 40px;
            position: absolute;
            left: 30px;
            transition: bottom 0.3s;
        }
        .obstacle {
            width: 20px;
            height: 40px;
            background: #ff3333;
            position: absolute;
            right: 0;
            border-radius: 4px;
        }
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs button {
            flex: 1;
            padding: 8px;
            background: #2c2c2c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav-tabs button.active {
            background: #ff5722;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>🐔 Chicken Run</h2>
            <div class="wallet-box">Rs: <span id="balance">0</span></div>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('game')">Game</button>
            <button class="tab-btn" onclick="switchTab('deposit')">Deposit</button>
            <button class="tab-btn" onclick="switchTab('withdraw')">Withdraw</button>
        </div>

        <!-- GAME SECTION -->
        <div id="game" class="section active">
            <div class="game-area" id="gameArea">
                <div class="chicken" id="chicken" style="bottom: 20px;">🐔</div>
            </div>
            <p style="text-align: center; margin-bottom: 10px; font-size: 14px; color: #aaa;">Jump to avoid obstacles & win coins!</p>
            <button class="btn" onclick="jumpChicken()">Jump! (Cost: 10 Rs)</button>
            <button class="btn btn-secondary" onclick="startGame()">Start Game</button>
        </div>

        <!-- DEPOSIT SECTION -->
        <div id="deposit" class="section">
            <h3>Add Funds (Manual)</h3>
            <p style="font-size: 13px; color: #aaa; margin-top: 5px;">Send money to our JazzCash/EasyPaisa account and submit details below.</p>
            
            <div style="background: #2c2c2c; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 14px;">
                <p><b>JazzCash / EasyPaisa:</b> 0300-1234567</p>
                <p><b>Account Title:</b> Admin Gaming</p>
            </div>

            <label>Select Method</label>
            <select id="depMethod">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
            </select>

            <label>Amount (PKR)</label>
            <input type="number" id="depAmount" placeholder="Enter amount">

            <label>Transaction ID (TID)</label>
            <input type="text" id="depTid" placeholder="Enter 11-digit TID">

            <button class="btn" onclick="submitDeposit()">Submit Deposit Request</button>
        </div>

        <!-- WITHDRAW SECTION -->
        <div id="withdraw" class="section">
            <h3>Withdraw Funds</h3>
            
            <label>Select Method</label>
            <select id="wdMethod">
                <option value="JazzCash">JazzCash</option>
                <option value="EasyPaisa">EasyPaisa</option>
            </select>

            <label>Account Number</label>
            <input type="text" id="wdAccount" placeholder="03XXXXXXXXX">

            <label>Amount (PKR)</label>
            <input type="number" id="wdAmount" placeholder="Enter amount">

            <button class="btn" onclick="submitWithdraw()">Request Withdrawal</button>
        </div>
    </div>

    <script>
        let balance = 100; // Free starting balance for testing
        updateBalance();

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance;
        }

        function jumpChicken() {
            if (balance < 10) {
                alert("Low balance! Please deposit funds to play.");
                return;
            }
            balance -= 10;
            updateBalance();

            const chicken = document.getElementById('chicken');
            chicken.style.bottom = '120px';
            setTimeout(() => {
                chicken.style.bottom = '20px';
                // Random win reward
                if (Math.random() > 0.4) {
                    balance += 25;
                    updateBalance();
                }
            }, 300);
        }

        function startGame() {
            alert("Game session active! Tap Jump to play.");
        }

        function submitDeposit() {
            const amount = document.getElementById('depAmount').value;
            const tid = document.getElementById('depTid').value;
            if(!amount || !tid) {
                alert("Please fill all fields!");
                return;
            }
            alert("Deposit request submitted successfully! Admin will verify your TID (" + tid + ") and approve within 30 minutes.");
            document.getElementById('depAmount').value = '';
            document.getElementById('depTid').value = '';
        }

        function submitWithdraw() {
            const amount = document.getElementById('wdAmount').value;
            const account = document.getElementById('wdAccount').value;
            if(!amount || !account) {
                alert("Please fill all fields!");
                return;
            }
            if(amount > balance) {
                alert("Insufficient balance!");
                return;
            }
            balance -= parseInt(amount);
            updateBalance();
            alert("Withdrawal request submitted for " + amount + " PKR to " + account);
            document.getElementById('wdAmount').value = '';
            document.getElementById('wdAccount').value = '';
        }
    </script>
</body>
</html>
