<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Run PK - Play & Earn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 10px;
        }
        header {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .wallet-box {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: space-around;
            font-size: 16px;
        }
        .wallet-box span {
            color: #4CAF50;
            font-weight: bold;
        }
        .game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 250px;
            background: #2b2b2b;
            margin: 0 auto;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #4a90e2, #50e3c2);
            width: 100%;
            height: 100%;
        }
        .btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            width: 90%;
            max-width: 400px;
        }
        .btn:active {
            background: #e6b800;
        }
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        .ctrl-btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #startBtn { background: #4CAF50; color: #fff; }
        #pauseBtn { background: #ff9800; color: #fff; }
        .section {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin: 15px auto;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .section h3 {
            color: #ffcc00;
            margin-bottom: 10px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐔 Chicken Run PK</h1>
        <p>Play Game & Deposit via TID</p>
    </header>

    <div class="wallet-box">
        <div>Balance: <span id="userBalance">Rs. 0</span></div>
        <div>Score: <span id="currentScore">0</span></div>
    </div>

    <!-- Game Area -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="250"></canvas>
    </div>

    <!-- Game Control Buttons -->
    <div class="control-panel" style="max-width: 400px; margin: 10px auto;">
        <button class="ctrl-btn" id="startBtn" onclick="startGame()">Start Game</button>
        <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()">Pause</button>
    </div>

    <button class="btn" id="jumpBtn" onclick="makeJump()">JUMP (TAP HERE)</button>

    <!-- Deposit & TID Section -->
    <div class="section">
        <h3>JazzCash Deposit Verification</h3>
        <p style="font-size: 13px; margin-bottom: 3px;">Send payment to JazzCash Account:</p>
        <p style="font-size: 16px; color: #ffcc00; text-align: center; font-weight: bold; margin-bottom: 8px;">03034902887</p>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 8px;">Payment ke baad apni TID yahan enter karein:</p>
        
        <input type="number" id="depositAmount" placeholder="Enter Amount (e.g. 500)">
        <input type="text" id="tidInput" placeholder="Enter Transaction ID (TID)">
        
        <button class="btn" style="width:100%; margin: 5px 0; background: #25D366; color: #fff;" onclick="submitTID()">Verify via WhatsApp</button>
    </div>

    <script>
        // LocalStorage Wallet Setup
        let balance = localStorage.getItem('chicken_balance') ? parseInt(localStorage.getItem('chicken_balance')) : 0;
        document.getElementById('userBalance').innerText = 'Rs. ' + balance;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gravity = 0.6;
        let gameStarted = false;
        let isPaused = false;
        let isGameOver = false;

        let chicken = {
            x: 50,
            y: 170,
            width: 30,
            height: 30,
            dy: 0,
            jumpPower: -10,
            grounded: true
        };

        let obstacle = {
            x: 400,
            y: 175,
            width: 20,
            height: 25,
            speed: 5
        };

        function makeJump() {
            if (!gameStarted || isPaused || isGameOver) return;

            if (chicken.grounded) {
                chicken.dy = chicken.jumpPower;
                chicken.grounded = false;
            }
        }

        function startGame() {
            gameStarted = true;
            isPaused = false;
            isGameOver = false;
            score = 0;
            document.getElementById('currentScore').innerText = score;
            document.getElementById('pauseBtn').innerText = 'Pause';
            obstacle.x = 400;
            obstacle.speed = 5;
            chicken.y = 170;
            chicken.dy = 0;
        }

        function togglePause() {
            if (!gameStarted || isGameOver) return;
            
            isPaused = !isPaused;
            let pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                pauseBtn.innerText = 'Resume';
            } else {
                pauseBtn.innerText = 'Pause';
            }
        }

        function update() {
            if (!gameStarted || isPaused || isGameOver) return;

            chicken.dy += gravity;
            chicken.y += chicken.dy;

            if (chicken.y > 170) {
                chicken.y = 170;
                chicken.dy = 0;
                chicken.grounded = true;
            }

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -20) {
                obstacle.x = 400;
                score += 10;
                document.getElementById('currentScore').innerText = score;
                if(score % 50 === 0) obstacle.speed += 0.5;
            }

            // Collision detection
            if (
                chicken.x < obstacle.x + obstacle.width &&
                chicken.x + chicken.width > obstacle.x &&
                chicken.y < obstacle.y + obstacle.height &&
                chicken.y + chicken.height > obstacle.y
            ) {
                isGameOver = true;
                handleGameOverEarnings();
            }
        }

        function handleGameOverEarnings() {
            let earnedReward = Math.floor(score / 10);
            if (earnedReward > 0) {
                balance += earnedReward;
                localStorage.setItem('chicken_balance', balance);
                document.getElementById('userBalance').innerText = 'Rs. ' + balance;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 200, canvas.width, 50);

            // Chicken
            ctx.font = '28px Arial';
            ctx.fillText('🐔', chicken.x - 4, chicken.y + 24);

            // Obstacle
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            // Initial Start Screen Overlay
            if (!gameStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.fillText('Click "Start Game" to Play', 95, 120);
            }

            // Pause Screen Overlay
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffcc00';
                ctx.font = '22px Arial';
                ctx.fillText('Game Paused', 130, 130);
            }

            // Game Over Screen Overlay
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                let earnedReward = Math.floor(score / 10);
                ctx.fillText(`Game Over! Earned: Rs. ${earnedReward}`, 35, 100);
                ctx.fillText('Click Start Game to Retry', 90, 140);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        // TID & WhatsApp Submission Logic
        function submitTID() {
            let amount = document.getElementById('depositAmount').value.trim();
            let tid = document.getElementById('tidInput').value.trim();

            if (!amount || !tid) {
                alert('Please enter both Amount and Transaction ID (TID)!');
                return;
            }

            let adminPhone = '923034902887'; 
            let message = `Hello Admin, I have sent Rs. ${amount} via JazzCash to your account (03034902887).%0ATID: ${tid}%0APlease verify and add balance to my account.`;
            let whatsappURL = `https://wa.me/${adminPhone}?text=${message}`;

            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
