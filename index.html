<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        .game-container {
            width: 600px;
            height: 200px;
            background: #162447;
            border-bottom: 4px solid #e43f5a;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        #avatar {
            width: 40px;
            height: 50px;
            background: #00ffcc;
            position: absolute;
            bottom: 0;
            left: 50px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 10px #00ffcc;
        }
        #obstacle {
            width: 25px;
            height: 40px;
            background: #e43f5a;
            position: absolute;
            bottom: 0;
            left: 600px;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 0 10px #e43f5a;
        }
        .jump {
            animation: jumpAnim 0.6s linear;
        }
        @keyframes jumpAnim {
            0% { bottom: 0; }
            50% { bottom: 110px; }
            100% { bottom: 0; }
        }
        .score-board {
            margin-top: 15px;
            font-size: 1.2rem;
            background: #1f4068;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .instructions {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a7a9be;
        }
    </style>
</head>
<body>

    <h1>Avatar Runner Game</h1>
    
    <div class="game-container" id="gameContainer">
        <div id="avatar">🏃‍♂️</div>
        <div id="obstacle"></div>
    </div>

    <div class="score-board">
        Score: <span id="score">0</span>
    </div>
    
    <div class="instructions">
        Tap screen ya **Spacebar** dabayein jump karne ke liye!
    </div>

    <script>
        const avatar = document.getElementById("avatar");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");

        let score = 0;
        let isAlive;
        let gameStarted = false;

        // Jump Function
        function jump() {
            if (!avatar.classList.contains("jump")) {
                avatar.classList.add("jump");
                setTimeout(() => {
                    avatar.classList.remove("jump");
                }, 600);
            }
        }

        // Controls (Keyboard & Touch)
        document.addEventListener("keydown", function (event) {
            if (event.code === "Space" || event.key === "ArrowUp") {
                if (!gameStarted) {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        document.addEventListener("click", function () {
            if (!gameStarted) {
                startGame();
            } else {
                jump();
            }
        });

        function startGame() {
            gameStarted = true;
            score = 0;
            obstacle.style.animation = "moveObstacle 1.8s infinite linear";
            
            // Collision Detection Loop
            isAlive = setInterval(function () {
                let avatarBottom = parseInt(window.getComputedStyle(avatar).getPropertyValue("bottom"));
                let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));

                // Score increase
                score++;
                scoreDisplay.innerText = Math.floor(score / 5);

                // Game Over Condition (Collision Check)
                if (obstacleLeft > 40 && obstacleLeft < 80 && avatarBottom < 35) {
                    alert("Game Over! Aapka Score: " + Math.floor(score / 5));
                    resetGame();
                }
            }, 10);
        }

        function resetGame() {
            clearInterval(isAlive);
            obstacle.style.animation = "none";
            obstacle.style.left = "600px";
            gameStarted = false;
            score = 0;
        }
    </script>

    <!-- CSS Animation style dynamically injected for obstacle movement -->
    <style>
        @keyframes moveObstacle {
            0% { left: 600px; }
            100% { left: -30px; }
        }
    </style>
</body>
</html>
